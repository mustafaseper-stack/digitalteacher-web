<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Dijital Öğretmen Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f5f7fa; 
            color: #333; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
        }
        .contact-container { 
            background: #fff; 
            max-width: 500px; 
            width: 100%; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); 
        }
        h1 { color: #3f51b5; margin-top: 0; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 6px; }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input:focus, textarea:focus { 
            outline: none; 
            border-color: #3f51b5; 
            box-shadow: 0 0 5px rgba(63, 81, 181, 0.3); 
        }
        button { 
            background-color: #3f51b5; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background-color: #303f9f; }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Bize Ulaşın</h1>
        <p>Görüş, öneri veya destek talepleriniz için aşağıdaki formu doldurarak bize e-posta gönderebilirsiniz.</p>

        <!-- DİKKAT: action kısmındaki e-posta adresini KENDİ ADRESİNİZLE değiştirin -->
        <form action="https://formsubmit.co/mustafa.aksu.app@gmail.com" method="POST">
            
            <!-- Formsubmit gizli ayarları -->
            <input type="hidden" name="_subject" value="Dijital Öğretmen'den Yeni İletişim Mesajı!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://digitalteacherapp.com/tr/iletisim.html">

            <div class="form-group">
                <label for="name">Adınız Soyadınız</label>
                <input type="text" id="name" name="Ad Soyad" required placeholder="Örn: Ali Yılmaz">
            </div>

            <div class="form-group">
                <label for="email">E-posta Adresiniz</label>
                <input type="email" id="email" name="E-posta" required placeholder="Örn: ali@ornek.com">
            </div>

            <div class="form-group">
                <label for="message">Mesajınız</label>
                <textarea id="message" name="Mesaj" rows="5" required placeholder="Nasıl yardımcı olabiliriz?"></textarea>
            </div>

            <button type="submit">Mesajı Gönder</button>
        </form>
    </div>

</body>
</html>
