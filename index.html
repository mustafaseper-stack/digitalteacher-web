<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Teacher</title>
    <script>
        // Tarayıcı dilini kontrol et
        var lang = navigator.language || navigator.userLanguage;
        // Eğer dil Türkçe ise /tr/ klasörüne, değilse /en/ klasörüne yönlendir
        if (lang.indexOf('tr') > -1) {
            window.location.replace("/tr/");
        } else {
            window.location.replace("/en/");
        }
    </script>
</head>
<body>
</body>
</html>
